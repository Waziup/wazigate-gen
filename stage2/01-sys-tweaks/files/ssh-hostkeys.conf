# Generate the SSH host keys if they are missing, every time sshd starts.
#
# 01-run.sh deliberately deletes /etc/ssh/ssh_host_*_key* from the image so
# that every gateway gets its own keys, and raspberrypi-sys-mods ships
# regenerate_ssh_host_keys.service to recreate them. That unit carries
# ConditionFirstBoot=yes, so it runs only on the boot where systemd finds
# /etc/machine-id empty. If anything consumes that one boot -- a reboot from
# the first-boot resize, an image written to a card that was booted once in a
# test rig -- the keys are never created and sshd exits with "no hostkeys
# available", permanently. That happened on the first trixie image that got far
# enough to boot.
#
# ssh-keygen -A only creates key types that are absent, so this costs nothing
# on every boot after the first and cannot overwrite existing keys.
[Service]
ExecStartPre=/usr/bin/ssh-keygen -A
